<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10b981" />

  <!-- Default SEO — overridden per-store by Vue -->
  <title>QeSuite Stores — Shop Local, Delivered Fast</title>
  <meta name="description" content="Discover and order from local grocery stores, pharmacies, restaurants and more. Fast delivery, easy checkout, track your order live." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://store.qesuite.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://store.qesuite.com/" />
  <meta property="og:title" content="QeSuite Stores — Shop Local, Delivered Fast" />
  <meta property="og:description" content="Discover and order from local grocery stores, pharmacies, restaurants and more. Fast delivery, easy checkout, track your order live." />
  <meta property="og:site_name" content="QeSuite Stores" />
  <meta property="og:locale" content="en_KE" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="QeSuite Stores — Shop Local, Delivered Fast" />
  <meta name="twitter:description" content="Discover and order from local grocery stores, pharmacies, restaurants and more." />

  <!-- Google AdSense — replace ca-pub-XXXXXXXXXXXXXXXX with your Publisher ID -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
     crossorigin="anonymous"></script>

  <!-- JSON-LD: Marketplace -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "QeSuite Stores",
    "url": "https://store.qesuite.com",
    "description": "Online marketplace for local stores in Kenya — groceries, pharmacies, restaurants and more.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://store.qesuite.com/?search={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
